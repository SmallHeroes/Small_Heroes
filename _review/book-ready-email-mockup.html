<!DOCTYPE html>
<!--
  MOCKUP — redesigned "book ready" email for Guy's approval.
  Gmail-safe: table layout + inline CSS (the <style> block below is progressive-enhancement only —
  every critical style is also inline). RTL Hebrew. In the real template the cover <img src> becomes
  ${coverImageUrl} and the button hrefs become ${readUrl} / view / ${pdfUrl}; copy comes from EMAIL.body.
-->
<html dir="rtl" lang="he" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>הספר מוכן!</title>
  <!-- Heebo for browsers/Gmail-web that allow it; Arial fallback everywhere -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Progressive enhancement only — core styles are inline. */
    @media only screen and (max-width: 620px) {
      .sh-card { padding: 28px 20px !important; }
      .sh-cover { width: 72% !important; }
      .sh-h1 { font-size: 26px !important; }
      .sh-btn a { font-size: 16px !important; }
    }
    a { text-decoration: none; }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#F5F2FF; direction:rtl;">
  <!-- preheader (hidden) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">הספר האישי של נועם מוכן — פתחו וצאו להרפתקה יחד.</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F2FF; direction:rtl;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- brand mark -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;">
          <tr>
            <td align="center" style="padding-bottom:16px;">
              <span style="font-family:Heebo,Arial,sans-serif; font-size:15px; font-weight:700; letter-spacing:0.5px; color:#7C3AED;">✨ גיבורים קטנים</span>
            </td>
          </tr>
        </table>

        <!-- card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="sh-card" style="max-width:600px; width:100%; background-color:#FFFFFF; border-radius:24px; box-shadow:0 12px 44px rgba(124,58,237,0.14); padding:44px 40px;">
          <tr>
            <td align="center" style="direction:rtl; text-align:center;">

              <!-- greeting -->
              <p style="margin:0 0 6px; font-family:Heebo,Arial,sans-serif; font-size:15px; color:#9CA3AF;">שלום דנה,</p>

              <!-- hero title -->
              <h1 class="sh-h1" style="margin:0 0 10px; font-family:Heebo,Arial,sans-serif; font-size:31px; line-height:1.2; font-weight:800; color:#6D28D9;">הספר של נועם מוכן! ✨</h1>

              <!-- subtitle -->
              <p style="margin:0 0 28px; font-family:Heebo,Arial,sans-serif; font-size:16.5px; line-height:1.55; color:#6B7280;">
                ההרפתקה האישית שלו מחכה — עם דמות בהשראתו וחבר מלווה.<br>פתחו וצאו לדרך יחד.
              </p>

              <!-- COVER (dynamic per order → coverImageUrl) -->
              <img src="mock-cover.svg" alt="כריכת הספר של נועם" width="280" class="sh-cover"
                   style="width:280px; max-width:80%; height:auto; border-radius:18px; box-shadow:0 16px 38px rgba(76,29,149,0.28); display:block; margin:0 auto 32px;">

              <!-- PRIMARY button → open the book (reader) -->
              <table role="presentation" cellpadding="0" cellspacing="0" class="sh-btn" style="margin:0 auto 14px;">
                <tr>
                  <td align="center" bgcolor="#7C3AED" style="border-radius:999px; box-shadow:0 8px 20px rgba(124,58,237,0.35);">
                    <a href="#read" style="display:inline-block; padding:16px 54px; font-family:Heebo,Arial,sans-serif; font-size:17px; font-weight:700; color:#FFFFFF; border-radius:999px;">פתח את הספר</a>
                  </td>
                </tr>
              </table>

              <!-- SECONDARY button → listen mode (audio-only) -->
              <table role="presentation" cellpadding="0" cellspacing="0" class="sh-btn" style="margin:0 auto;">
                <tr>
                  <td align="center" bgcolor="#FFFFFF" style="border-radius:999px; border:2px solid #7C3AED;">
                    <a href="#listen" style="display:inline-block; padding:13px 46px; font-family:Heebo,Arial,sans-serif; font-size:15px; font-weight:600; color:#7C3AED; border-radius:999px;">השמע את הספר</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <!-- footer -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%;">
          <tr>
            <td align="center" style="padding:22px 16px 8px;">
              <p style="margin:0; font-family:Heebo,Arial,sans-serif; font-size:12.5px; color:#9CA3AF;">גיבורים קטנים — סיפורי חוסן לילדים</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
